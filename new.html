<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMS - Autonomous Fleet Control Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; }
        .glass-panel { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="h-16 border-b border-slate-200 glass-panel px-6 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider text-slate-900">ARMS <span class="text-xs font-normal px-2 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-200">P2P EDGE FLEET</span></h1>
        </div>
        <div class="flex items-center space-x-6 text-sm">
            <div><span class="text-slate-500">Active AMRs:</span> <span id="active-count" class="font-bold text-slate-900">3</span></div>
            <div><span class="text-slate-500">Network:</span> <span class="text-emerald-600 font-medium">Decentralized Mesh</span></div>
            <div><span class="text-slate-500">Conflict Mode:</span> <span class="text-blue-600 font-medium">Auto-Negotiation</span></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 grid grid-cols-12 gap-4 p-4 overflow-hidden">
        
        <!-- Left Column: Spatial Fleet Map & Telemetry Chart -->
        <section class="col-span-8 flex flex-col space-y-4">
            
            <!-- 2D Spatial Map Visualization -->
            <div class="flex-1 glass-panel rounded-xl p-4 flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">Warehouse Map & AMR Spatial Coordinates</h2>
                    <span class="text-xs text-slate-400">Scale: 1px = 10cm</span>
                </div>
                <div class="flex-1 bg-slate-50 rounded-lg relative border border-slate-200 flex items-center justify-center">
                    <canvas id="mapCanvas" class="w-full h-full"></canvas>
                </div>
            </div>

            <!-- Fleet Battery & Telemetry Panel -->
            <div class="h-48 glass-panel rounded-xl p-4 flex flex-col">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-2">Fleet Battery Telemetry (%)</h2>
                <div class="flex-1 relative">
                    <canvas id="batteryChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Right Column: Status Cards & Logs -->
        <section class="col-span-4 flex flex-col space-y-4">
            
            <!-- Robot Telemetry Cards -->
            <div class="glass-panel rounded-xl p-4 flex flex-col space-y-3">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500">Individual AMR Node Telemetry</h2>
                <div id="robot-cards-container" class="space-y-2">
                    <!-- Dynamic AMR Cards -->
                </div>
            </div>

            <!-- Real-Time Event Console Log -->
            <div class="flex-1 glass-panel rounded-xl p-4 flex flex-col overflow-hidden">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-2">Decentralized Event Log</h2>
                <div id="log-console" class="flex-1 bg-slate-900 rounded-lg p-3 font-mono text-xs overflow-y-auto space-y-1 border border-slate-800 text-slate-200">
                    <div class="text-slate-400">[SYSTEM] Mesh network initialized...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- JS Logic -->
    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const chartCtx = document.getElementById('batteryChart').getContext('2d');
        const batteryChart = new Chart(chartCtx, {
            type: 'line',
            data: {
                labels: ['0s', '5s', '10s', '15s', '20s', '25s'],
                datasets: [
                    { label: 'AMR 01', data: [98, 97, 96, 96, 95, 95], borderColor: '#2563eb', tension: 0.3 },
                    { label: 'AMR 02', data: [85, 84, 84, 83, 82, 82], borderColor: '#059669', tension: 0.3 },
                    { label: 'AMR 03', data: [62, 61, 60, 60, 59, 58], borderColor: '#d97706', tension: 0.3 }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { labels: { color: '#475569' } } },
                scales: {
                    x: { grid: { color: '#f1f5f9' }, ticks: { color: '#64748b' } },
                    y: { grid: { color: '#f1f5f9' }, ticks: { color: '#64748b' } }
                }
            }
        });

        const ws = new WebSocket('ws://localhost:8000/ws/telemetry');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            renderMap(data.robots);
            renderRobotCards(data.robots);
            if (data.log) addLog(data.log);
        };

        function renderMap(robots) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Light Grid Lines
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for(let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw AMR Nodes
            robots.forEach(robot => {
                ctx.fillStyle = robot.color;
                ctx.beginPath();
                ctx.arc(robot.x, robot.y, 12, 0, 2 * Math.PI);
                ctx.fill();

                // Node Outline
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Labels
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(robot.id, robot.x - 18, robot.y - 18);
            });
        }

        function renderRobotCards(robots) {
            const container = document.getElementById('robot-cards-container');
            container.innerHTML = '';
            robots.forEach(r => {
                container.innerHTML += `
                    <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center">
                        <div>
                            <div class="font-bold text-sm text-slate-900">${r.id}</div>
                            <div class="text-xs text-slate-500">State: <span class="text-emerald-600 font-semibold">${r.state}</span></div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-mono text-slate-700">Pos: (${r.x}, ${r.y})</div>
                            <div class="text-xs text-slate-500">Bat: <span class="text-blue-600 font-semibold">${r.battery}%</span></div>
                        </div>
                    </div>
                `;
            });
        }

        function addLog(message) {
            const console = document.getElementById('log-console');
            const entry = document.createElement('div');
            entry.className = 'text-slate-300';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }
    </script>
</body>
</html>
